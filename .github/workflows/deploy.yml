name: Deploy to GitHub Pages

on:
  schedule:
    # Rebuild the arXiv index and redeploy every day at 06:00 UTC.
    - cron: "0 6 * * 0"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-wide backstop. The index step below may use up 75 of these, leaving
    # 15 minutes for checkout, both dependency installs, the npm build and the
    # Pages artifact upload -- together ~120 s on CI, so >7x headroom.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build the paper index
        # Same rule as ci.yml's index step: the cap must be looser than the
        # client's worst case, or this dies on GitHub's generic timeout instead
        # of build_index.py's own "Refusing to write an index: the arXiv query
        # failed for ..." (IMP-004).
        #
        # --max-per-category 30000 is arXiv's own ceiling for one query (see
        # RESULTS_CEILING in scripts/arxiv_common.py: the manual caps a query at
        # 30,000 results and answers anything above it with HTTP 400), and it is
        # deliberately equal to it rather than a smaller round number. This cap is
        # a safety bound against the API ceiling, not a way to say how many papers
        # we want, so it has to sit clear of real window sizes instead of just
        # above them: the largest 60-day window among the 5 categories was cs.AI
        # at 10,785 papers on 2026-10-02, and arXiv grows ~9% per window, so
        # anything near 12,000 would have started truncating within a year and
        # said nothing. 30,000 is 2.8x that measurement, and a category that
        # reaches it is not truncated by us -- arXiv refuses the offset first,
        # and the category degrades on its own.
        #
        # What it costs: nothing on a healthy run. The 60-day retention window is
        # what stops a healthy run -- 38 pages across the 5 categories today, the
        # same 38 this command paged before the flag existed, because the cap only
        # bites once a category outgrows it. If a cap ever does bite,
        # build_index.py records it in index.json under "truncatedCategories" and
        # the site says the index is incomplete, so it is no longer a silent cut.
        #
        # collect_papers records a failed category and moves to the next one, so
        # a total network partition costs one worst-case page fetch per category:
        #     5 categories x (num_retries 5 + 1) x 60 s = 1800 s
        # and main() logs the category list and returns 1 without writing an
        # index. That 1800 s is what the step cap is sized against:
        #     75 min = 4500 s is 2.5x it
        # which is what DeployStepTimeoutTests asserts. The compound case IMP-198
        # modelled beyond it -- every page burning its full 60 s bound and still
        # succeeding, 70 x 38 pages + 1800 s = 4460 s -- leaves 40 s, which is
        # IMP-205's finding F-1 and not this step's to absorb; raising the cap
        # there is IMP-205's change. A healthy deploy is ~2-5 min.
        timeout-minutes: 75
        run: python scripts/build_index.py --max-per-category 30000

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build the web app
        # Order matters and is now asserted: the index has to be in
        # web/public/data before this runs, because `vite build` copies that
        # directory into web/dist/data verbatim and only if it already exists.
        # The step below is what makes that ordering load-bearing rather than
        # merely correct today.
        working-directory: web
        run: npm run build

      - name: Assert the paper index reached the build output
        # IMP-029. The two steps above are ordered correctly today but nothing
        # said so: if build_index.py failed softly, or wrote its output
        # somewhere other than web/public/data, `npm run build` still exits 0
        # and the artifact ships a site that renders "No paper index yet"
        # forever, with every other check in this workflow green.
        #
        # This asserts the FILESYSTEM rather than HTTP, on purpose. A health
        # check like `curl -o /dev/null -w %{http_code} .../data/index.json`
        # returns 200 for any missing path, because the single-page-app
        # fallback answers it, so it cannot distinguish a served index from an
        # absent one. Reading the files is the only check that can.
        #
        # Only python3 (already on the runner) and shell builtins are used, so
        # this adds no dependency -- notably not jq, which the runner does not
        # guarantee -- and the whole check stays auditable in place.
        #
        # A truncated-but-present index passes, and should: a category that hit
        # its --max-per-category cap records itself in index.json under
        # "truncatedCategories" and the site says so on screen. What must never
        # ship is an index that is missing, unreadable, empty, or that points at
        # shards which are not in the artifact.
        run: |
          set -euo pipefail

          data_dir="web/dist/data"

          if [ ! -f "${data_dir}/index.json" ]; then
            echo "::error::No paper index in the build output: ${data_dir}/index.json is missing." >&2
            echo "The build copies web/public/data verbatim, so this means the index was never built or landed somewhere else. Refusing to publish." >&2
            exit 1
          fi

          if ! shards="$(python3 -c 'import json, sys; print("\n".join(shard["file"] for shard in json.load(open(sys.argv[1]))["shards"]))' "${data_dir}/index.json")"; then
            echo "::error::${data_dir}/index.json could not be read as an index manifest." >&2
            exit 1
          fi

          if [ -z "${shards}" ]; then
            echo "::error::${data_dir}/index.json names no shards, so there is no index to publish." >&2
            exit 1
          fi

          while IFS= read -r shard; do
            [ -n "${shard}" ] || continue
            if [ ! -f "${data_dir}/${shard}" ]; then
              echo "::error::Shard named by ${data_dir}/index.json is missing from the build output: ${data_dir}/${shard}" >&2
              exit 1
            fi
          done <<< "${shards}"

          echo "Paper index present: $(printf '%s\n' "${shards}" | wc -l | tr -d ' ') shard(s)."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # actions/deploy-pages just waits for the upload to go live (tens of
    # seconds), but `concurrency.cancel-in-progress` is false, so a deploy that
    # wedges here would block every later deploy too. Cheap insurance.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
