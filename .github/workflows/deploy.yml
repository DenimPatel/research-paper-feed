name: Deploy to GitHub Pages

on:
  schedule:
    # Rebuild the arXiv index and redeploy every day at 06:00 UTC.
    - cron: "0 6 * * 0"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-wide backstop. The index step below may use up 75 of these, leaving
    # 15 minutes for checkout, both dependency installs, the two quality gates,
    # the npm build and the Pages artifact upload -- ~120 s on CI plus a few
    # seconds per gate, so still >7x headroom.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        # Byte-identical to ci.yml's python-tests job (ci.yml:19), including the
        # repo-root working directory: this job sets no defaults.run, so the
        # default applies.
        #
        # Duplicated on purpose. A workflow cannot depend on another workflow's
        # job, so this run cannot see whether CI was green -- which is how a red
        # main could publish anyway. Repeating the gate above the index build is
        # the only thing that stops that, so this must stay ABOVE
        # "Build the paper index".
        run: python -m unittest discover -s tests -v

      - name: Install web dependencies
        # Moved above the gates that need it: `npm run typecheck` below runs
        # against web/node_modules, so the install cannot stay below the index
        # build. Nothing else moved -- this step and its `uses:` line are
        # unchanged, only their position.
        working-directory: web
        run: npm ci

      - name: Typecheck
        # Byte-identical to ci.yml's web-tests job (ci.yml:46), which takes its
        # working directory from that job's defaults.run; deploy.yml has no
        # defaults.run, so it is spelled out here as every other web step does.
        #
        # `npm run typecheck` is `tsc --noEmit` and is the only static analysis
        # either stack has: there is no lint script in web/package.json and no
        # Python linter configured, so adding one here would name a command that
        # does not exist rather than gate anything.
        #
        # Deliberately not `npm test`: the 292-test web suite belongs to CI's
        # web-tests job, and this item is the Python suite plus typecheck.
        working-directory: web
        run: npm run typecheck

      - name: Build the paper index
        # Same rule as ci.yml's index step: the cap must be looser than the
        # client's worst case, or this dies on GitHub's generic timeout instead
        # of build_index.py's own "Refusing to write an index: the arXiv query
        # failed for ..." (IMP-004).
        #
        # --max-per-category 10000 is a bound on DEPTH, not a content budget, and the
        # number it is sized from is DEPLOY_OFFSET_BUDGET in
        # scripts/build_index.py, which the tests read this command against.
        # arXiv answers a deep `start` with a 5xx rather than a page: cat:cs.AI
        # returned HTTP 500 at start=10000 on two consecutive full production
        # builds on 2026-10-02, the same offset both times, while cs.LG reached
        # start=9000 and cs.CV stopped at start=6000. The client's 5 retries
        # over ~60 s all came back 500, because arXiv does not space them, and
        # the offset is a function of how many in-window papers a category
        # holds, so it moves and no pinned offset stays pinned.
        #
        # What does not move is the arithmetic: the client asks for page_size
        # (1000) results at `start` and advances by page_size, so a cap of
        # 10,000 makes start=9000 the deepest request this command can ever
        # make, for every category, at every size. 9,000 is the deepest offset
        # arXiv is known to have answered and 10,000 the first known to be
        # refused, so the bound is one whole page below the fault and is
        # enforced by a test rather than by a comment.
        #
        # What that costs, stated rather than waved at: it is a content trade
        # made for a robustness one. cs.AI held 10,785 papers inside the 60-day
        # window on 2026-10-02, so this cap truncates it by at least 785 (~7%)
        # on a healthy run -- and only cs.AI, since cs.LG (9,723) still fits.
        # (The deployed index loses less than that, by however many of those
        # papers are cross-listed and arrive through another category's query;
        # that figure is not measured here and is not claimed.) That is the
        # deliberate trade: the papers past the offset used to be unreachable
        # anyway, and the category used to be DELETED from the index and
        # described on screen as having "no papers here" while those same
        # papers sat in the shards it had just written. A category that reaches
        # the cap now degrades by being recorded in index.json under
        # "truncatedCategories" and announced as such on screen ("cut off ...
        # may be missing"), which is the truth, not by disappearing. Raise the
        # cap past 10,000 and the refused offset is back in play.
        #
        # Page arithmetic, recomputed for the new cap. The measured 60-day
        # windows (IMP-198's verifier, 2026-10-02) are cs.CV 6,742 / cs.LG 9,723
        # / cs.CL 5,213 / cs.AI 10,785 / cs.RO 3,275 = 35,738 papers, which is
        # 38 pages of 1,000. Under this cap cs.AI's 11th page is never asked
        # for, so a healthy deploy pages 37, where the old 30,000 cap paged
        # those same 38 and allowed up to 30 per category (150 across the five).
        #
        # collect_papers records a failed category and moves to the next one, so
        # a total network partition costs one worst-case page fetch per category:
        #     5 categories x (num_retries 5 + 1) x 60 s = 1800 s
        # and main() logs the category list and returns 1 without writing an
        # index. That 1800 s is what the step cap is sized against:
        #     75 min = 4500 s is 2.5x it
        # which is what DeployStepTimeoutTests asserts. IMP-198's compound case
        # beyond it -- every page burning its full 60 s bound and still
        # succeeding -- is recomputed against 37 pages rather than 38:
        #     37 x 70 s + 1800 s = 4390 s, which leaves 110 s (was 40 s)
        # so the cap is no longer the one input IMP-205's F-1 is fighting, and
        # the worst case across all five categories is now 50 pages rather than
        # 150. A healthy deploy is ~2-5 min.
        timeout-minutes: 75
        run: python scripts/build_index.py --max-per-category 10000

      - name: Build the web app
        # Order matters and is now asserted: the index has to be in
        # web/public/data before this runs, because `vite build` copies that
        # directory into web/dist/data verbatim and only if it already exists.
        # The step below is what makes that ordering load-bearing rather than
        # merely correct today.
        working-directory: web
        run: npm run build

      - name: Assert the paper index reached the build output
        # IMP-029. The two steps above are ordered correctly today but nothing
        # said so: if build_index.py failed softly, or wrote its output
        # somewhere other than web/public/data, `npm run build` still exits 0
        # and the artifact ships a site that renders "No paper index yet"
        # forever, with every other check in this workflow green.
        #
        # This asserts the FILESYSTEM rather than HTTP, on purpose. A health
        # check like `curl -o /dev/null -w %{http_code} .../data/index.json`
        # returns 200 for any missing path, because the single-page-app
        # fallback answers it, so it cannot distinguish a served index from an
        # absent one. Reading the files is the only check that can.
        #
        # Only python3 (already on the runner) and shell builtins are used, so
        # this adds no dependency -- notably not jq, which the runner does not
        # guarantee -- and the whole check stays auditable in place.
        #
        # A truncated-but-present index passes, and since IMP-216 that is the
        # EXPECTED shape rather than an exception: cs.AI sits above the cap above,
        # so it records itself in index.json under "truncatedCategories", keeps
        # its filter chip, and the site says its older papers may be missing.
        # That is the honest state and this check must stay permissive on it.
        # What must never ship is an index that is missing, unreadable, empty,
        # or that points at shards which are not in the artifact -- and, since a
        # category that answered is not in failedCategories unless the index
        # truly holds nothing for it, a manifest whose failedCategories names a
        # category its own shards contradict. That last one is a data bug rather
        # than a pipeline one, so it is build_index.py's invariant to keep, not
        # this step's to check.
        run: |
          set -euo pipefail

          data_dir="web/dist/data"

          if [ ! -f "${data_dir}/index.json" ]; then
            echo "::error::No paper index in the build output: ${data_dir}/index.json is missing." >&2
            echo "The build copies web/public/data verbatim, so this means the index was never built or landed somewhere else. Refusing to publish." >&2
            exit 1
          fi

          if ! shards="$(python3 -c 'import json, sys; print("\n".join(shard["file"] for shard in json.load(open(sys.argv[1]))["shards"]))' "${data_dir}/index.json")"; then
            echo "::error::${data_dir}/index.json could not be read as an index manifest." >&2
            exit 1
          fi

          if [ -z "${shards}" ]; then
            echo "::error::${data_dir}/index.json names no shards, so there is no index to publish." >&2
            exit 1
          fi

          while IFS= read -r shard; do
            [ -n "${shard}" ] || continue
            if [ ! -f "${data_dir}/${shard}" ]; then
              echo "::error::Shard named by ${data_dir}/index.json is missing from the build output: ${data_dir}/${shard}" >&2
              exit 1
            fi
          done <<< "${shards}"

          echo "Paper index present: $(printf '%s\n' "${shards}" | wc -l | tr -d ' ') shard(s)."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # actions/deploy-pages just waits for the upload to go live (tens of
    # seconds), but `concurrency.cancel-in-progress` is false, so a deploy that
    # wedges here would block every later deploy too. Cheap insurance.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
